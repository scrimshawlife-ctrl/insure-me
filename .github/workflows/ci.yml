name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - runtime/**

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct canonical lockfile
        shell: bash
        run: |
          cat .ci/lock-snapshot/part-*.b64 | base64 --decode | gzip --decompress > pnpm-lock.yaml
      - name: Verify canonical lockfile
        shell: bash
        run: |
          expected="$(tr -d '[:space:]' < .ci/pnpm-lock.sha256)"
          actual="$(sha256sum pnpm-lock.yaml | awk '{print $1}')"
          test "$actual" = "$expected" || {
            echo "canonical lock snapshot is invalid"
            echo "expected: $expected"
            echo "actual:   $actual"
            exit 1
          }
      - name: Upload canonical lockfile
        uses: actions/upload-artifact@v4
        with:
          name: canonical-pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 7

  verify:
    needs: dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.0.0
      - uses: actions/download-artifact@v4
        with:
          name: canonical-pnpm-lock
          path: .
      - name: Install from verified lockfile
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Run repository secret baseline scanner
        id: secret_baseline
        if: always()
        run: pnpm security:secrets
        env:
          SECURITY_SCAN_REPORT_PATH: artifacts/secret-baseline-report-v1.json
      - name: Upload repository secret baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secret-baseline-report-v1
          path: artifacts/secret-baseline-report-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Run repository SAST baseline scanner
        id: sast_baseline
        if: always()
        run: pnpm security:sast
        env:
          SECURITY_SCAN_REPORT_PATH: artifacts/sast-baseline-report-v1.json
      - name: Upload repository SAST baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-baseline-report-v1
          path: artifacts/sast-baseline-report-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Run production dependency audit baseline
        id: dependency_audit_baseline
        if: always()
        run: pnpm security:dependencies
        env:
          PNPM_AUDIT_REPORT_PATH: artifacts/pnpm-audit-baseline-report-v1.json
      - name: Upload production dependency audit baseline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-audit-baseline-report-v1
          path: artifacts/pnpm-audit-baseline-report-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Run canonical synthetic scenario suite
        run: pnpm scenario:run
        env:
          CANONICAL_SCENARIO_REPORT_PATH: artifacts/canonical-scenario-report-v1.json
      - name: Verify canonical scenario report
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('artifacts/canonical-scenario-report-v1.json', 'utf8'));
          if (report.schemaVersion !== 'canonical-scenario-report-v1') throw new Error('unexpected scenario report schema');
          if (report.total !== 12 || report.passed !== 12 || report.failed !== 0) {
            throw new Error(`canonical scenario report is not clean: ${JSON.stringify({ total: report.total, passed: report.passed, failed: report.failed })}`);
          }
          NODE
      - name: Upload canonical scenario report
        uses: actions/upload-artifact@v4
        with:
          name: canonical-scenario-report-v1
          path: artifacts/canonical-scenario-report-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Run provider outage drill
        id: provider_outage_drill
        run: pnpm test:provider-outage-drill
        env:
          PROVIDER_OUTAGE_DRILL_REPORT_PATH: artifacts/provider-outage-drill-report-v1.json
      - name: Upload provider outage drill evidence
        if: always() && steps.provider_outage_drill.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: provider-outage-drill-report-v1
          path: artifacts/provider-outage-drill-report-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Run provider credential rotation drill
        id: provider_credential_rotation_drill
        run: pnpm test:provider-credential-rotation-drill
        env:
          PROVIDER_CREDENTIAL_ROTATION_DRILL_REPORT_PATH: artifacts/provider-credential-rotation-drill-report-v1.json
      - name: Upload provider credential rotation drill evidence
        if: always() && steps.provider_credential_rotation_drill.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: provider-credential-rotation-drill-report-v1
          path: artifacts/provider-credential-rotation-drill-report-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Run incident response tabletop
        id: incident_response_tabletop
        run: pnpm test:incident-response-tabletop
        env:
          INCIDENT_RESPONSE_TABLETOP_REPORT_PATH: artifacts/incident-response-tabletop-report-v1.json
      - name: Upload incident response tabletop evidence
        if: always() && steps.incident_response_tabletop.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: incident-response-tabletop-report-v1
          path: artifacts/incident-response-tabletop-report-v1.json
          if-no-files-found: error
          retention-days: 30
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_ci_key_000000000000000000
      - name: Run canonical load profile
        shell: bash
        run: |
          pnpm start > /tmp/insure-me-load-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health/readiness > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/insure-me-load-server.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/health/readiness > /dev/null
          pnpm test:load
        env:
          DEPLOYMENT_STAGE: synthetic
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_synthetic_ci_key_000000000000000000
          LOAD_TEST_BASE_URL: http://127.0.0.1:3000
          LOAD_TEST_REPORT_PATH: artifacts/load-test-report-v1.json
      - name: Upload canonical load report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report-v1
          path: artifacts/load-test-report-v1.json
          if-no-files-found: error
          retention-days: 30

  database:
    needs: dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.0.0
      - uses: actions/download-artifact@v4
        with:
          name: canonical-pnpm-lock
          path: .
      - name: Install from verified lockfile
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: pnpm db:start
      - name: Rebuild database from migrations
        run: pnpm db:reset
      - name: Run pgTAP database tests
        run: pnpm db:test
      - name: Lint database
        run: pnpm db:lint
      - name: Generate database types
        run: pnpm exec supabase gen types typescript --local --schema public > generated-database.types.ts
      - name: Verify generated database contract
        shell: bash
        run: |
          expected="$(tr -d '[:space:]' < .ci/database-types.sha256)"
          actual="$(sha256sum generated-database.types.ts | awk '{print $1}')"
          test "$actual" = "$expected" || {
            echo "generated database type drift detected"
            echo "expected: $expected"
            echo "actual:   $actual"
            exit 1
          }
      - name: Run isolated backup and restore drill
        run: pnpm test:restore-drill
        env:
          RESTORE_DRILL_DB_CONTAINER: supabase_db_insure-me
          RESTORE_DRILL_REPORT_PATH: artifacts/restore-drill-report-v1.json
      - name: Upload restore drill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-report-v1
          path: artifacts/restore-drill-report-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Run security assessment readiness gate
        run: pnpm security-assessment:readiness
        env:
          SECURITY_ASSESSMENT_METADATA_PATH: testdata/security-assessment/synthetic-ready-metadata-v1.json
          SECURITY_ASSESSMENT_READINESS_REPORT_PATH: artifacts/security-assessment-readiness-report-v1.json
      - name: Upload security assessment readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-assessment-readiness-report-v1
          path: artifacts/security-assessment-readiness-report-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run privacy-rights rehearsal
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="${API_URL:-$SUPABASE_URL}" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" \
          SUPABASE_SECRET_KEY="${SERVICE_ROLE_KEY:-$SECRET_KEY}" \
          SUPABASE_DB_URL="${DB_URL:-$SUPABASE_DB_URL}" \
          pnpm test:privacy-rights-rehearsal
        env:
          PRIVACY_REHEARSAL_REPORT_PATH: artifacts/privacy-rights-rehearsal-report-v1.json
      - name: Upload privacy-rights rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-rights-rehearsal-report-v1
          path: artifacts/privacy-rights-rehearsal-report-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Run adverse-action rehearsal
        run: |
          eval "$(pnpm exec supabase status -o env)"
          NEXT_PUBLIC_SUPABASE_URL="${API_URL:-$SUPABASE_URL}" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}" \
          SUPABASE_JWT_SECRET="${JWT_SECRET:-$SUPABASE_JWT_SECRET}" \
          SUPABASE_DB_URL="${DB_URL:-$SUPABASE_DB_URL}" \
          pnpm test:adverse-action-rehearsal
        env:
          ADVERSE_ACTION_REHEARSAL_REPORT_PATH: artifacts/adverse-action-rehearsal-report-v1.json
      - name: Upload adverse-action rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adverse-action-rehearsal-report-v1
          path: artifacts/adverse-action-rehearsal-report-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload verified database types
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: generated-database.types.ts
          if-no-files-found: error
      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop
